<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drops — DropStack</title>
    <meta name="description" content="Browse open source Drops managed through DropStack.">
    <meta name="theme-color" id="metaTheme" content="#0a1310">
    <link rel="icon" href="assets/logo/iconlogo.png">

    <script>
        (function () {
            try {
                var theme = localStorage.getItem('oa-theme') || 'dark';
                var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (theme === 'dark' || (theme === 'system' && systemDark)) document.documentElement.classList.add('dark');
            } catch (e) { document.documentElement.classList.add('dark'); }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
                    },
                    colors: {
                        background: 'var(--background)', card: 'var(--card)', popover: 'var(--popover)',
                        border: 'var(--border)', primary: 'var(--foreground)',
                        secondary: 'var(--secondary)', accent: 'var(--accent)'
                    }
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referencerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-background text-primary font-sans antialiased min-h-screen flex flex-col">
    <header class="site-header sticky top-0 z-40 w-full border-b border-border">
        <div class="mx-auto max-w-6xl px-4 sm:px-6">
            <div class="flex h-16 items-center justify-between gap-3">
                <div class="flex items-center gap-7">
                    <a href="index.html" class="flex items-center gap-2.5 text-[15px] font-semibold tracking-tight">
                        <img src="assets/logo/logo-main-light.png" alt="DropStack logo" class="h-6 w-auto dark:hidden">
                        <img src="assets/logo/logo-main-dark.png" alt="DropStack logo" class="hidden h-6 w-auto dark:block">
                    </a>
                    <nav class="hidden md:flex items-center gap-0.5 text-sm font-medium">
                        <a href="projects.html" class="nav-link active">Drops</a>
                        <a href="news.html" class="nav-link">News</a>
                        <a href="about.html" class="nav-link">About</a>
                    </nav>
                </div>
                <div class="flex items-center gap-2">
                    <a href="admin.html" class="btn btn-outline hidden sm:inline-flex"><i class="fa-solid fa-lock text-[11px]"></i> Admin</a>
                    <div class="theme-wrap relative" id="themeWrap">
                        <button id="themeBtn" class="icon-btn" aria-label="Change theme" aria-haspopup="listbox" aria-expanded="false">
                            <span id="tiSun" class="hidden"><i class="fa-solid fa-sun text-[15px]"></i></span>
                            <span id="tiMoon"><i class="fa-solid fa-moon text-[15px]"></i></span>
                            <span id="tiMonitor" class="hidden"><i class="fa-solid fa-desktop text-[15px]"></i></span>
                        </button>
                        <div class="theme-menu" id="themeMenu" role="listbox" aria-label="Appearance">
                            <p class="px-2.5 pb-1 pt-1.5 text-[10px] font-semibold uppercase tracking-wider text-secondary">Appearance</p>
                            <button class="theme-option" role="option" data-set-theme="light" aria-selected="false"><span><i class="fa-solid fa-sun text-[14px]"></i></span> Light<span class="check"><i class="fa-solid fa-check text-[12px]"></i></span></button>
                            <button class="theme-option" role="option" data-set-theme="dark" aria-selected="false"><span><i class="fa-solid fa-moon text-[14px]"></i></span> Dark<span class="check"><i class="fa-solid fa-check text-[12px]"></i></span></button>
                            <button class="theme-option" role="option" data-set-theme="system" aria-selected="false"><span><i class="fa-solid fa-desktop text-[14px]"></i></span> System<span class="check"><i class="fa-solid fa-check text-[12px]"></i></span></button>
                        </div>
                    </div>
                    <button id="menuBtn" class="icon-btn md:hidden" aria-label="Toggle menu">
                        <span id="miMenu"><i class="fa-solid fa-bars text-[15px]"></i></span>
                        <span id="miClose" class="hidden"><i class="fa-solid fa-xmark text-[15px]"></i></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="mobile-menu hidden border-t border-border md:hidden" data-shared-mobile-menu>
            <nav class="mx-auto flex max-w-6xl flex-col gap-0.5 px-4 py-3 text-sm font-medium">
                <a href="projects.html" class="nav-link">Drops</a>
                <a href="news.html" class="nav-link">News</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="admin.html" class="nav-link"><i class="fa-solid fa-lock mr-2 text-[11px]"></i>Admin</a>
            </nav>
        </div>
    </header>

    <main class="flex-1">
        <section class="page-hero">
            <div class="grid-bg pointer-events-none" aria-hidden="true"></div>
            <div class="relative mx-auto max-w-6xl px-4 sm:px-6">
                <p class="page-eyebrow"><i class="fa-solid fa-layer-group"></i> OPEN SOURCE DIRECTORY</p>
                <div class="mt-3 flex flex-wrap items-end justify-between gap-5">
                    <div>
                        <h1 class="text-3xl font-bold tracking-[-0.03em] sm:text-5xl">Drops</h1>
                        <p class="mt-3 max-w-2xl text-sm leading-relaxed text-secondary sm:text-base">Explore every active Drop in the DropStack directory. Search by name, topic, license, or category.</p>
                    </div>
                    <p id="projectCount" class="font-mono text-xs text-secondary">Loading…</p>
                </div>
                <div class="relative mt-8 max-w-xl">
                    <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-secondary"><i class="fa-solid fa-magnifying-glass text-[14px]"></i></span>
                    <input id="projectSearch" class="page-search" type="search" autocomplete="off" placeholder="Search Drops…" aria-label="Search Drops">
                </div>
            </div>
        </section>

        <section class="mx-auto max-w-6xl px-4 pb-20 sm:px-6">
            <div id="projectsList" class="grid gap-3"></div>
            <div class="mt-10 flex flex-wrap justify-center gap-3">
                <a href="admin.html" class="btn btn-accent"><i class="fa-solid fa-plus text-[12px]"></i> Add Drop</a>
                <a href="index.html" class="btn btn-outline">Back home</a>
            </div>
        </section>
    </main>

    <footer class="border-t border-border">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-6 text-xs text-secondary sm:flex-row">
            <p>© <span data-current-year>2026</span> DropStack</p>
            <a href="index.html" class="hover:text-primary">Back to homepage</a>
        </div>
    </footer>

    <script src="data/alternatives.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
