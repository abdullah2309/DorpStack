<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — DropStack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script>
    (function () { try { var t = localStorage.getItem('oa-theme') || 'dark'; if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); } }());
  </script>
  <style>
    .admin-auth { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--background); }
    .auth-card { width:100%; max-width:420px; padding:32px; border:1px solid var(--border); border-radius:18px; background:var(--card); box-shadow:var(--geist-shadow); }
    .auth-logo { display:block; height:30px; width:auto; margin:0 auto 24px; }
    .auth-card h1 { margin:0; text-align:center; font-size:25px; letter-spacing:-.03em; }
    .auth-card p { margin:8px 0 24px; color:var(--secondary); text-align:center; font-size:13px; }
    .auth-label { display:block; margin:14px 0 6px; color:var(--secondary); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .auth-input { width:100%; height:42px; padding:0 12px; border:1px solid var(--border); border-radius:9px; background:var(--background); color:var(--foreground); outline:0; }
    .auth-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
    .auth-submit { width:100%; height:42px; margin-top:22px; border:0; border-radius:9px; background:var(--accent); color:#06130b; font-weight:700; }
    .auth-error { min-height:18px; margin-top:12px; color:#e5484d; font-size:12px; text-align:center; }
    #adminPanel { display:none; min-height:100vh; background:var(--background); }
    .panel-head { position:sticky; top:0; z-index:4; display:flex; justify-content:space-between; align-items:center; padding:13px max(16px,calc((100vw - 1152px)/2)); border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--background) 90%,transparent); backdrop-filter:blur(12px); }
    .panel-title { font-weight:700; font-size:14px; }
    .panel-actions { display:flex; gap:8px; align-items:center; }
    .panel-frame { width:100%; height:calc(100vh - 61px); min-height:760px; border:0; display:block; }
    code { font-family:"Geist Mono",monospace; color:var(--accent); }
  </style>
</head>
<body>
  <section id="login" class="admin-auth">
    <form id="loginForm" class="auth-card" autocomplete="off">
      <img src="assets/logo/logo-main-light.png" class="auth-logo dark:hidden" alt="DropStack">
      <img src="assets/logo/logo-main-dark.png" class="auth-logo hidden dark:block" alt="DropStack">
      <h1>Admin login</h1>
      <p>Only admins can add Drops, news and ads.</p>
      <label class="auth-label" for="username">Username</label>
      <input class="auth-input" id="username" required autocomplete="username">
      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" id="password" type="password" required autocomplete="current-password">
      <button class="auth-submit" type="submit"><i class="fa-solid fa-lock-open"></i> Sign in</button>
      <div id="loginError" class="auth-error" role="alert"></div>
    </form>
  </section>
  <section id="adminPanel">
    <header class="panel-head">
      <a href="index.html" class="panel-title">DropStack / Admin Panel</a>
      <div class="panel-actions"><span class="admin-badge" style="color:var(--accent);font:600 11px 'Geist Mono',monospace"><i class="fa-solid fa-circle"></i> ADMIN</span><button id="logout" class="btn btn-outline">Log out</button></div>
    </header>
    <iframe class="panel-frame" src="data.html" title="DropStack admin data panel"></iframe>
  </section>
  <script>
    (function () {
      'use strict';
      var KEY = 'dropstack-admin-session';
      var login = document.getElementById('login'), panel = document.getElementById('adminPanel');
      function showPanel() { login.style.display='none'; panel.style.display='block'; }
      if (sessionStorage.getItem(KEY) === '1') showPanel();
      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value;
        if (user === 'admin' && pass === 'admin_123') { sessionStorage.setItem(KEY,'1'); showPanel(); }
        else document.getElementById('loginError').textContent = 'Invalid username or password.';
      });
      document.getElementById('logout').addEventListener('click', function () { sessionStorage.removeItem(KEY); location.reload(); });
    }());
  </script>
</body>
</html>
