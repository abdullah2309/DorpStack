<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Data Panel — DropStack</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
.admin-data{max-width:1120px;margin:auto;padding:28px 18px}.admin-data header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.admin-data h1{margin:0;font-size:28px}.admin-data .muted{color:var(--secondary);font-size:13px;line-height:1.55}.admin-tabs{display:flex;gap:8px;margin:18px 0}.admin-tabs button{border:1px solid var(--border);border-radius:8px;padding:9px 14px;background:transparent;color:var(--secondary)}.admin-tabs button.active{background:var(--foreground);color:var(--background)}.admin-list{display:grid;gap:10px}.admin-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card)}.admin-row strong{font-size:14px}.admin-row small{display:block;margin-top:4px;color:var(--secondary)}.admin-modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:#0009}.admin-modal.open{display:grid}.admin-form{width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--popover)}.admin-form h2{margin:0 0 18px}.admin-field{margin-top:13px}.admin-field label{display:block;margin-bottom:5px;color:var(--secondary);font-size:11px;font-weight:700;text-transform:uppercase}.admin-field input,.admin-field textarea,.admin-field select{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--background);color:var(--foreground)}.admin-field textarea{min-height:90px;resize:vertical}.admin-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}.admin-note{padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,var(--card));color:var(--secondary);font-size:12px}.admin-error{color:#e5484d;font-size:12px;margin-top:10px}.admin-row a{color:var(--accent);font-size:12px;word-break:break-all}@media(max-width:600px){.admin-data header{align-items:flex-start;flex-direction:column}.admin-row{align-items:flex-start;flex-direction:column}}
</style>
<script>(function(){try{var t=localStorage.getItem('oa-theme')||'dark';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}})();</script>
</head>
<body class="bg-background text-primary font-sans">
<main class="admin-data">
<header><div><h1>Admin data</h1><p class="muted">Add Drops, news and ads. Links are saved in the data files and open in a new tab on public cards.</p></div><button id="addBtn" class="btn btn-accent"><i class="fa-solid fa-plus"></i> Add data</button></header>
<div class="admin-note"><i class="fa-solid fa-folder-open"></i> First save par repository ka <b>data/</b> folder select karo. Records automatically <code>data/alternatives.js</code> ya <code>data/news.js</code> me save honge.</div>
<nav class="admin-tabs"><button data-type="drop" class="active">Drops</button><button data-type="news">News</button><button data-type="ad">Ads</button></nav>
<section id="list" class="admin-list"></section>
</main>
<div id="modal" class="admin-modal"><form id="form" class="admin-form"><div style="display:flex;justify-content:space-between;gap:12px"><h2 id="modalTitle">Add data</h2><button type="button" id="closeBtn" class="icon-btn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div id="fields"></div><div id="error" class="admin-error"></div><div class="admin-actions"><button type="button" id="cancelBtn" class="btn btn-outline">Cancel</button><button class="btn btn-accent" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save to data folder</button></div></form></div>
<script>if(sessionStorage.getItem('dropstack-admin-session')!=='1')location.href='admin.html';</script>
<script src="data/alternatives.js"></script><script src="data/news.js"></script><script src="js/main.js"></script>
<script>
(function(){'use strict';var type='drop',editing=null,dir=null,handles={},alts=JSON.parse(JSON.stringify(window.ALTERNATIVES_DATA||{products:[],ads:[]})),news=JSON.parse(JSON.stringify(window.NEWS_DATA||[]));
var $=function(id){return document.getElementById(id)}, esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})},id=function(){return Date.now().toString(16)+Math.random().toString(16).slice(2,6)},now=function(){return new Date().toISOString().slice(0,16).replace('T',' ')},valid=function(v){try{var u=new URL(v);return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}};
function items(){return type==='drop'?alts.products:type==='news'?news:alts.ads}function render(){ $('list').innerHTML=items().map(function(r){var title=r.name||r.title||'Untitled';return '<div class="admin-row"><div><strong>'+esc(title)+'</strong><small>'+esc(r.status||'draft')+'</small>'+(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+'</div><button class="btn btn-outline edit" data-id="'+esc(r.id)+'">Edit</button></div>'}).join('')||'<p class="muted">No data yet.</p>'}
function field(label,key,value,kind){return '<div class="admin-field"><label>'+label+'</label>'+(kind==='textarea'?'<textarea id="f_'+key+'">'+esc(value)+'</textarea>':'<input id="f_'+key+'" type="'+(kind||'text')+'" value="'+esc(value)+'">')+'</div>'}
function openForm(rec){editing=rec||null;$('modalTitle').textContent=(rec?'Edit ':'Add ')+(type==='drop'?'Drop':type==='news'?'News':'Ad');var h='';if(type==='drop'){h+=field('Drop name','name',rec&&rec.name);h+=field('GitHub URL','github',rec&&rec.github_url,'url');h+=field('Description','description',rec&&rec.description,'textarea');h+=field('License','license',rec&&rec.license||'MIT');h+=field('Link (opens in new tab)','link',rec&&rec.link,'url')}else if(type==='news'){h+=field('Title','title',rec&&rec.title);h+=field('Source','source',rec&&rec.source||'DropStack');h+=field('Time','time',rec&&rec.time||'just now');h+=field('Link (opens in new tab)','link',rec&&rec.link,'url')}else{h+=field('Ad title','title',rec&&rec.title);h+=field('Ad text','text',rec&&rec.text,'textarea');h+=field('Link (opens in new tab)','link',rec&&rec.link,'url')}$('fields').innerHTML=h;$('error').textContent='';$('modal').classList.add('open')}
function close(){ $('modal').classList.remove('open') }function build(){if(type==='drop')return{id:editing?editing.id:id(),name:$('f_name').value.trim(),github_url:$('f_github').value.trim(),description:$('f_description').value.trim(),license:$('f_license').value.trim()||'MIT',link:$('f_link').value.trim(),status:editing?editing.status:'active',level:editing&&editing.level||1,pricing:editing&&editing.pricing||'Open Source',categories:editing&&editing.categories||[],topics:editing&&editing.topics||[],votes:editing&&editing.votes||0,comments:editing&&editing.comments||0,views:editing&&editing.views||'0',trending:editing&&editing.trending||50,added:editing&&editing.added||new Date().toISOString().slice(0,10),created_at:editing&&editing.created_at||now(),logo:editing&&editing.logo||{bg:'#00a751',fg:'#ffffff',icon:'fa-solid fa-cube'},altTo:editing&&editing.altTo||[]};if(type==='news')return{id:editing?editing.id:id(),title:$('f_title').value.trim(),source:$('f_source').value.trim()||'DropStack',time:$('f_time').value.trim()||'just now',link:$('f_link').value.trim(),created_at:editing&&editing.created_at||now(),status:editing?editing.status:'published',icon:editing&&editing.icon||'fa-solid fa-newspaper',bg:editing&&editing.bg||'#00a751',fg:editing&&editing.fg||'#ffffff'};return{id:editing?editing.id:id(),title:$('f_title').value.trim(),text:$('f_text').value.trim(),link:$('f_link').value.trim(),created_at:editing&&editing.created_at||now(),status:editing?editing.status:'active',icon:editing&&editing.icon||'fa-solid fa-bullhorn',bg:editing&&editing.bg||'#00a751',fg:editing&&editing.fg||'#ffffff'}}
function jsFile(){return 'window.ALTERNATIVES_DATA = '+JSON.stringify(alts,null,2)+';\n'}function newsFile(){return 'window.NEWS_DATA = '+JSON.stringify(news,null,2)+';\n'}async function write(){if(!dir){dir=await showDirectoryPicker({mode:'readwrite'});handles.alts=await dir.getFileHandle('alternatives.js');handles.news=await dir.getFileHandle('news.js')}var a=await handles.alts.createWritable();await a.write(jsFile());await a.close();var n=await handles.news.createWritable();await n.write(newsFile());alert('Saved in data folder')}
$('form').addEventListener('submit',async function(e){e.preventDefault();var r=build();if(!r.name&&!r.title){$('error').textContent='Name/title required';return}if(r.link&&!valid(r.link)){$('error').textContent='Use a valid http(s) link';return}var arr=items(),i=arr.findIndex(function(x){return x.id===r.id});if(i>=0)arr[i]=r;else arr.unshift(r);try{await write();close();render()}catch(err){$('error').textContent=err.message||'Could not write data folder'}});document.querySelectorAll('[data-type]').forEach(function(b){b.onclick=function(){type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});$('addBtn').onclick=function(){openForm(null)};$('closeBtn').onclick=close;$('cancelBtn').onclick=close;$('list').onclick=function(e){var b=e.target.closest('.edit');if(b)openForm(items().find(function(x){return x.id===b.dataset.id}))};render()})()
</script></body></html>
